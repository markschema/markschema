name: Publish @markschema/mdshape

on:
  push:
    tags:
      - "mdshape@*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=packages/mdshape

      - name: Test
        run: npm run test --workspace=packages/mdshape

      - name: Publish
        run: npm publish --workspace=packages/mdshape --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
